name: Build test and deploy Mars MVP
on:
  push:
    branches: [main]
    paths: ['release-request.json', '.github/workflows/build-test-deploy.yml', '.github/scripts/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mars-verified-production-release
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: preview
          persist-credentials: false
      - name: Read immutable source request
        id: source
        run: |
          python3 - <<'PY'
          import json,re,os
          request=json.load(open('preview/release-request.json'))
          sha=request['sourceCommit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+sha+'\n')
          PY
      - name: Checkout private source temporarily
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/dengluhuoxing
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.LAYA_SOURCE_READ_TOKEN || secrets.PREVIEW_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.layaair
          key: mars-layaair-3.4.0-ubuntu-v1
      - name: Install official SDK and browser dependencies
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.layaair/layaair" ]; then curl -fsSL --retry 2 https://raw.githubusercontent.com/layabox/layaair-cli/master/install.sh | bash; fi
          if [ ! -d "$HOME/.layaair/3.4.0/Resources/engine/types" ]; then "$HOME/.layaair/layaair" install 3.4.0; fi
          "$HOME/.layaair/layaair" list
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          cd source
          npm install --ignore-scripts
          ln -s "$HOME/.layaair/3.4.0/Resources/engine/types" engine
      - name: SDK typecheck and logic regression
        working-directory: source
        run: npm run typecheck && npm test
      - name: Official LayaAir 3.4.0 build and startup packaging
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: npm run release:build
      - name: Serve official Web package
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory "$WEB_ROOT" > /tmp/mars-official-http.log 2>&1 &
          for n in $(seq 1 20); do if curl -fsS http://127.0.0.1:4174/ > /dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Startup failure handling
        working-directory: source
        env:
          SMOKE_URL: http://127.0.0.1:4174
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node .github/scripts/startup-test.mjs
      - name: Visual, touch and frame budgets
        working-directory: source
        env:
          SMOKE_URL: http://127.0.0.1:4174
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node .github/scripts/art-visual.mjs
      - name: Low frame cadence and complete S encounter
        working-directory: source
        env:
          SMOKE_URL: http://127.0.0.1:4174
          SMOKE_VIEWPORT: 390x844
          SMOKE_FLIGHT_ONLY: '1'
          SMOKE_FLIGHT_FPS: '15'
          SMOKE_SEED: '1'
          SMOKE_REQUIRE_SLALOM: '1'
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node .github/scripts/smoke-test.mjs
          mkdir -p artifacts/390x844-15fps
          cp artifacts/*.png artifacts/gameplay-flight-report.json artifacts/390x844-15fps/
      - name: Full gameplay 390x844
        working-directory: source
        env:
          SMOKE_URL: http://127.0.0.1:4174
          SMOKE_VIEWPORT: 390x844
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node .github/scripts/smoke-test.mjs
          mkdir -p artifacts/390x844
          cp artifacts/*.png artifacts/gameplay-report.json artifacts/390x844/
      - name: Full gameplay 375x667
        working-directory: source
        env:
          SMOKE_URL: http://127.0.0.1:4174
          SMOKE_VIEWPORT: 375x667
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node .github/scripts/smoke-test.mjs
          mkdir -p artifacts/375x667
          cp artifacts/*.png artifacts/gameplay-report.json artifacts/375x667/
      - name: Accept complete browser evidence and verify hashes
        working-directory: source
        run: |
          node tools/verify-release.mjs --accept
          npm run release:verify
      - name: Production hostname preflight
        working-directory: preview
        env:
          PREVIEW_URL: http://127.0.0.2:4175/
        run: |
          ln -s ../source/node_modules node_modules
          ln -s "$WEB_ROOT" web
          python3 -m http.server 4175 --bind 127.0.0.2 --directory "$WEB_ROOT" > /tmp/mars-production-http.log 2>&1 &
          for n in $(seq 1 20); do if curl --noproxy '*' -fsS http://127.0.0.2:4175/ > /dev/null; then break; fi; sleep 1; done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node .github/scripts/live-release.mjs
      - name: Verified Web package
        uses: actions/upload-artifact@v4
        with:
          name: mars-verified-web
          path: ${{ env.WEB_ROOT }}/
          if-no-files-found: error
      - name: Compact gameplay visual review
        if: always()
        working-directory: source
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {chromium} from 'playwright-core';
          const names=(await fs.readdir('artifacts').catch(()=>[])).filter(n=>/^route-.*\.png$/.test(n));
          const ordered=['route-slalom-1.png','route-slalom-2.png','route-slalom-3.png','route-slalom.png','route-fork.png','route-crossing.png','route-gates.png',...names];
          const selected=[...new Set(ordered.filter(n=>names.includes(n)))].slice(0,6);
          if(selected.length){
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            for(const name of selected){
              const bytes=await fs.readFile('artifacts/'+name);
              await page.setContent('<body style="margin:0;background:#081426;display:flex;justify-content:center"><img style="max-width:390px;max-height:844px;object-fit:contain" src="data:image/png;base64,'+bytes.toString('base64')+'"></body>');
              await page.locator('img').evaluate(img=>img.decode());
              const jpeg=await page.screenshot({type:'jpeg',quality:62});
              const encoded=jpeg.toString('base64');
              console.log('MARS_REVIEW_BEGIN:'+name+':390px-derived-thumbnail');
              for(let i=0;i<encoded.length;i+=16000)console.log('MARS_REVIEW_DATA:'+encoded.slice(i,i+16000));
              console.log('MARS_REVIEW_END');
            }
            await browser.close();
          }else console.log('No gameplay route captures yet; original QA artifacts remain authoritative.');
          JS
      - name: QA evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-experience-qa
          path: |
            source/artifacts/**/*.png
            source/artifacts/**/*.json
            preview/live-qa/
          if-no-files-found: warn
      - name: Prepare Pages artifact after all gates pass
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEB_ROOT }}/
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: pages
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: mars-verified-web
          path: web
      - name: Verify actual Pages release and touch gameplay
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.page_url }}
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.55.0 > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node .github/scripts/live-release.mjs
      - name: Live release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-live-release
          path: live-qa/
