name: Dispatch latest verified Mars release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dispatch the authorized immutable Web release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          request=json.load(open('release-request.json'))
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(path):return json.load(urllib.request.urlopen(urllib.request.Request(root+path,headers=headers)))
          run=get('/actions/runs/'+str(request['verifiedRun']))
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==request['verifiedHead']
          art=get('/actions/artifacts/'+str(request['artifactId']))
          assert not art['expired'] and art['digest']==request['artifactDigest']
          assert art['workflow_run']['id']==request['verifiedRun']
          dispatch=urllib.request.Request(root+'/actions/workflows/publish-mars-art.yml/dispatches',data=json.dumps({'ref':'main'}).encode(),headers=headers,method='POST')
          with urllib.request.urlopen(dispatch) as response:assert response.status==204
          print('Requested publication of the exact accepted official Web artifact')
          PY
