name: Request the approved Mars artwork release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/request-mars-release.yml']
permissions:
  contents: read
  actions: write
  pages: read
jobs:
  request:
    if: >-
      github.actor == 'BaiMaGod' && github.event.head_commit.message == 'release: publish verified Mars artwork 56ccffa'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the reviewed successful preflight and existing Actions Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def request(path,data=None):
              req=urllib.request.Request(root+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              response=urllib.request.urlopen(req)
              return json.load(response) if response.status!=204 else None
          run=request('/actions/runs/38118888876')
          assert run['conclusion']=='success' and run['head_sha']=='d2678889638c5c16c6551cc10d0182d26bbc156e'
          pages=request('/pages')
          print(json.dumps({'build_type':pages.get('build_type'),'url':pages.get('html_url'),'status':pages.get('status')}))
          assert pages['build_type']=='workflow','GitHub Pages Source must be GitHub Actions'
          request('/actions/workflows/publish-mars-art.yml/dispatches',json.dumps({'ref':'main'}).encode())
          print('Requested workflow_dispatch for the approved immutable official Web artifact')
          PY
