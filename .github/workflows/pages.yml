name: Verify Mars Web preview
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Separate live smoke tests from GitHub's own Pages deployment queue.
  group: mars-live-verification
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate published version
        run: |
          set -euo pipefail
          test -s index.html
          test -s js/bundle.js
          node --check js/bundle.js
          python3 - <<'PY'
          import json
          v=json.load(open("version.json"))
          assert v["sourceRepository"] == "BaiMaGod/dengluhuoxing" and v["sourceCommit"] == "b4ca19d63ff7b55b690cf976b6e05785d4b91aa6"
          print("Publishing verified main",v["sourceCommit"])
          PY
      - name: Wait for branch-published Pages to match current bundle
        env:
          PREVIEW_URL: https://baimagod.github.io/dengluhuoxing-preview/
        run: |
          set -euo pipefail
          expected="$(sha256sum js/bundle.js | awk '{print $1}')"
          for attempt in $(seq 1 36); do
            current="$(curl --fail --silent --show-error --max-time 15 "${PREVIEW_URL}js/bundle.js?rev=$GITHUB_SHA" | sha256sum | awk '{print $1}' || true)"
            if [ "$current" = "$expected" ]; then
              echo "Live Pages content matches current main branch"
              exit 0
            fi
            sleep 5
          done
          echo "Published Web bundle never matched this commit"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chinese fonts for accurate visual QA
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify live game
        env:
          PREVIEW_URL: https://baimagod.github.io/dengluhuoxing-preview/
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright-core@1.55.0 > /dev/null
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {chromium} from "playwright-core";
          const url=process.env.PREVIEW_URL;
          const version=await fetch(new URL("version.json",url),{cache:"no-store"}).then(r=>r.json());
          assert.equal(version.sourceCommit,"b4ca19d63ff7b55b690cf976b6e05785d4b91aa6");
          const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on("pageerror",e=>errors.push(e.message));
          page.on("response",r=>{if(r.status()>=400&&!r.url().endsWith("favicon.ico"))errors.push(r.status()+" "+r.url());});
          try {
            await page.goto(url,{waitUntil:"domcontentloaded"});
            await page.waitForFunction(()=>globalThis.Laya?.stage?.numChildren>0);
            await page.waitForTimeout(600);
            const expectedArt=["stage1_engine","stage1_tank","stage2_engine","stage2_tank","escape","cockpit","astronaut","asteroid","fuel","metal","chip","suit_energy","hud_panel"];
            await page.waitForFunction((names)=>names.every(n=>!!globalThis.Laya?.loader?.getRes("art/kit/"+n+".png")),expectedArt,{timeout:20000});
            for (const name of expectedArt) {
              const response=await page.request.get(new URL("art/kit/"+name+".png",url).toString());
              assert.equal(response.status(),200,"Missing published art "+name);
              assert.ok((await response.body()).byteLength>5000,"Unexpected tiny art "+name);
            }
            console.log("Loaded",expectedArt.length,"new PNG textures into Laya cache");
            await page.waitForTimeout(300);
            const p=await page.evaluate(()=>{
              function find(n){if(n.text==="开始造火箭"&&n.visible){const p=n.localToGlobal(new Laya.Point(n.width/2,n.height/2));return{x:p.x,y:p.y};}
                for(let i=0;i<n.numChildren;i++){const p=find(n.getChildAt(i));if(p)return p;}}
              const p=find(Laya.stage);return p&&{x:p.x/Laya.stage.width*390,y:p.y/Laya.stage.height*844};
            });
            assert.ok(p,"Live home screen has the start button");
            const verifyLayout=async (view) => {
              const rects=await page.evaluate(()=>{
                const root=(()=>{
                  function find(n){if(n.name==="home_panel")return n;for(let i=0;i<n.numChildren;i++){const found=find(n.getChildAt(i));if(found)return found;}}
                  return find(Laya.stage);
                })();
                if(!root)return [];
                const tests=[
                  text=>text.startsWith("历史最高"),
                  text=>text.startsWith("火星币"),
                  text=>text==="开始造火箭",
                  text=>text==="升级"||text.startsWith("升级  ·"),
                  text=>text.startsWith("音效："),
                  text=>text.startsWith("搭稳")
                ];
                const rects=[];
                function scan(node){
                  if(node instanceof Laya.Text && node.visible){
                    const index=tests.findIndex((test,i)=>!rects[i]&&test(node.text||""));
                    if(index>=0){
                      const point=node.localToGlobal(new Laya.Point(0,0));
                      rects[index]={top:point.y,bottom:point.y+node.height,text:node.text};
                    }
                  }
                  for(let i=0;i<node.numChildren;i++)scan(node.getChildAt(i));
                }
                scan(root);
                return rects;
              });
              assert.equal(rects.length,6,"All six home HUD/controls must be visible: "+view);
              for(let i=0;i<rects.length-1;i++){
                assert.ok(rects[i].bottom+4<=rects[i+1].top,
                  "Home elements overlap in "+view+": "+rects[i].text+" / "+rects[i+1].text);
              }
              console.log("Home layout has no overlapping text or buttons",view);
            };
            await verifyLayout("phone");
            const visualHome=await page.evaluate(()=>{
              const nodes=new Set();
              const visit=(n)=>{if(n.name)nodes.add(n.name);for(let i=0;i<n.numChildren;i++)visit(n.getChildAt(i));};
              visit(Laya.stage);
              return {mascot:nodes.has("home_astronaut_mascot"),record:nodes.has("home_stats_backdrop")};
            });
            assert.deepEqual(visualHome,{mascot:true,record:true},"Latest mascot and record artwork are required in real runtime");
            await page.screenshot({path:"live-home.png"});
            await page.setViewportSize({width:1280,height:800});
            await page.waitForFunction(()=>globalThis.Laya.stage.screenMode===Laya.Stage.SCREEN_NONE);
            await page.waitForTimeout(350);
            await verifyLayout("desktop");
            await page.screenshot({path:"live-home-desktop.png"});
            await page.setViewportSize({width:390,height:844});
            await page.waitForFunction(()=>globalThis.Laya.stage.screenMode===Laya.Stage.SCREEN_VERTICAL);
            await page.waitForTimeout(250);
            await page.mouse.click(p.x,p.y);
            await page.waitForFunction(()=>{
              function find(n){if(n.text?.startsWith("一级发动机"))return true;for(let i=0;i<n.numChildren;i++)if(find(n.getChildAt(i)))return true;return false;}
              return find(Laya.stage);
            });
            const feedbackPlate=await page.evaluate(()=>{
              let found=false;
              function scan(n){if(n.name==="mission_feedback_plate")found=true;
                for(let i=0;i<n.numChildren;i++)scan(n.getChildAt(i));}
              scan(Laya.stage);
              return found;
            });
            assert.ok(feedbackPlate,"The new HUD event plaque must exist in the running game");
            await page.screenshot({path:"live-game.png"});
            // Real tap-based six-piece rocket assembly, with no game-state shortcuts.
            const stagePoint=async x=>{
              const wh=await page.evaluate(()=>({w:Laya.stage.width,h:Laya.stage.height}));
              return {x:x/wh.w*390,y:x/wh.h*844};
            };
            for(let index=0;index<6;index++){
              await page.waitForFunction(i=>{
                let matched=false;
                function find(n){if(n.name?.startsWith("rocket_module_"+i+"_"))matched=true;
                  for(let j=0;j<n.numChildren;j++)find(n.getChildAt(j));}
                find(Laya.stage);
                return matched;
              },index,{timeout:24000});
              const p=await page.evaluate(i=>{
                let point=null;
                function find(n){if(n.name?.startsWith("rocket_module_"+i+"_")){
                    point={x:n.x,y:n.y};}
                  for(let j=0;j<n.numChildren;j++)find(n.getChildAt(j));}
                find(Laya.stage);
                return {x:point?.x/Laya.stage.width*390,y:point?.y/Laya.stage.height*844};
              },index);
              assert.ok(Number.isFinite(p.x)&&Number.isFinite(p.y),"Rocket module "+index+" has stage coordinates");
              await page.mouse.move(p.x,p.y);
              await page.mouse.down();
              await page.waitForTimeout(60);
              await page.mouse.up();
            }
            const findVisibleLabel=(label)=>page.evaluate(label=>{
              let point=null;
              function scan(n){
                if(n.text===label&&n.visible){
                  const p=n.localToGlobal(new Laya.Point(n.width/2,n.height/2));
                  point={x:p.x/Laya.stage.width*390,y:p.y/Laya.stage.height*844};return;
                }
                for(let j=0;j<n.numChildren && !point;j++)scan(n.getChildAt(j));
              }
              scan(Laya.stage);return point;
            },label);
            await page.waitForFunction(()=>{
              let found=false;
              function scan(n){if(n.text==="点火发射"&&n.visible)found=true;
                for(let j=0;j<n.numChildren;j++)scan(n.getChildAt(j));}
              scan(Laya.stage);return found;
            },null,{timeout:25000});
            await page.screenshot({path:"live-build-ready.png"});
            const fire=await findVisibleLabel("点火发射");
            assert.ok(fire);
            await page.mouse.click(fire.x,fire.y);
            await page.waitForFunction(()=>{
              let found=false;
              function scan(n){if(n.text==="点火成功！"&&n.visible)found=true;
                for(let j=0;j<n.numChildren;j++)scan(n.getChildAt(j));}
              scan(Laya.stage);return found;
            },null,{timeout:5000});
            await page.waitForTimeout(600);
            await page.screenshot({path:"live-ignition.png"});
            assert.deepEqual(errors,[]);
            console.log("Live preview loaded and entered rocket construction",url,version.sourceCommit);
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-preview-check
          path: |
            live-home.png
            live-home-desktop.png
            live-game.png
            live-build-ready.png
            live-ignition.png
          if-no-files-found: ignore
